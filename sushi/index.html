<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3a2414">
  <title>ねこ寿司ループ</title>
  <style>
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
    body { background:#2a190e; color:#3a2414; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif; }
    #app { position:relative; display:flex; flex-direction:column; max-width:480px; height:100%; margin:0 auto; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background:linear-gradient(#f2d3a2,#e2b679); }
    #hud { flex:0 0 46px; display:flex; align-items:center; gap:8px; padding:0 10px; background:#5a3519; color:#fff3dc; font-weight:800; box-shadow:0 2px 0 #3a2210; }
    #hud .lv { min-width:58px; font-size:17px; }
    #hud .prog { flex:1; position:relative; height:22px; border-radius:11px; background:#3a2210; overflow:hidden; }
    #hud .prog i { position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(#8fdc6a,#4fae3a); transition:width .3s; }
    #hud .prog span { position:relative; display:block; text-align:center; font-size:13px; line-height:22px; text-shadow:0 1px 0 #0006; }
    #hud button { width:36px; height:36px; border:0; border-radius:10px; background:#7a4a24; color:#fff; font-size:18px; }
    canvas { flex:1; display:block; width:100%; min-height:0; touch-action:none; }
    .overlay { position:absolute; inset:0; z-index:5; display:none; place-items:center; padding:24px; background:#2a190ecc; text-align:center; }
    .overlay.show { display:grid; }
    .card { width:min(100%,340px); padding:24px 20px; border-radius:24px; background:#fff6e6; box-shadow:0 14px 0 #c58a4a, 0 20px 40px #0008; }
    .card .big { font-size:72px; line-height:1; }
    .card h1 { margin:6px 0 2px; font-size:32px; color:#d9452b; text-shadow:0 3px 0 #ffd36a; letter-spacing:.02em; }
    .card h2 { margin:8px 0; font-size:26px; }
    .card p { margin:8px 0; font-size:14px; line-height:1.7; color:#6b4a2c; }
    .card ol { margin:10px 0; padding-left:1.3em; text-align:left; font-size:14px; line-height:1.7; color:#6b4a2c; }
    .card button { margin-top:12px; padding:14px 34px; border:0; border-radius:16px; background:linear-gradient(#ff7a4a,#e3452a); color:#fff; font-size:20px; font-weight:900; box-shadow:0 5px 0 #a82c17; }
    .card button:active { transform:translateY(3px); box-shadow:0 2px 0 #a82c17; }
    .modes { display:flex; gap:8px; margin-top:14px; }
    .card .modes button { flex:1; margin:0; padding:9px 4px; font-size:15px; background:#c9a37a; box-shadow:0 3px 0 #8d6a45; }
    .card .modes button:nth-child(2) { background:#e08a3a; box-shadow:0 3px 0 #a35a1a; }
    .card .modes button:nth-child(3) { background:#8a2d2d; box-shadow:0 3px 0 #561818; }
    .card .modes small { display:block; font-size:11px; opacity:.85; }
    .card .sub { display:block; margin:14px auto 0; padding:8px 18px; font-size:14px; background:#c9a37a; box-shadow:0 3px 0 #8d6a45; }
  </style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="lv" id="lv">Lv.1</div>
    <div class="prog"><i id="progBar"></i><span id="progText">0 / 0</span></div>
    <button id="btnSound" aria-label="サウンド">🔊</button>
    <button id="btnRetry" aria-label="やりなおし">↻</button>
  </div>
  <canvas id="cv"></canvas>

  <div class="overlay show" id="ovTitle"><div class="card">
    <div class="big">🐱🍣</div>
    <h1>ねこ寿司ループ</h1>
    <ol>
      <li>下のトレイをタップすると、いちばん上の寿司が<b>1皿ずつ</b>レーンに流れます</li>
      <li>お客さんは注文したネタが目の前を通ると取ってくれます</li>
      <li>レーンがいっぱいで流せなくなったら負け！</li>
      <li>レーンを長押しすると早送り</li>
    </ol>
    <button id="btnStart">あそぶ</button>
    <div class="modes">
      <button data-lv="1">かんたん<small>Lv.1〜</small></button>
      <button data-lv="8">むずかしい<small>Lv.8〜</small></button>
      <button data-lv="15">鬼<small>Lv.15〜</small></button>
    </div>
  </div></div>

  <div class="overlay" id="ovClear"><div class="card">
    <div class="big">😻</div>
    <h2 id="clearTitle">Lv.1 クリア！</h2>
    <p>お客さんみんな満腹です</p>
    <button id="btnNext">つぎへ</button>
  </div></div>

  <div class="overlay" id="ovOver"><div class="card">
    <div class="big">🙀</div>
    <h2>レーンがつまった…</h2>
    <p>注文にないネタでレーンが埋まってしまいました。<br>流す順番を考えてみよう！</p>
    <button id="btnAgain">もう一度</button>
  </div></div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ネタは導入順（序盤は見分けやすいものから）
  const TYPES = ['maguro', 'tamago', 'kappa', 'salmon', 'onigiri', 'ikura', 'ebi', 'tako', 'ika'];
  const ANIMALS = ['🐶', '🐰', '🐻', '🦊', '🐼', '🐨', '🐯', '🐸', '🐹', '🐷', '🐵', '🐧', '🐮', '🐭'];
  const TRACK_W = 44;
  const BASE_SPEED = 210; // px/秒
  const SEAT_COUNT = 4;

  const rand = n => Math.floor(Math.random() * n);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  // ---------- サウンド ----------
  let AC = null;
  let soundOn = store.get('sushi.sound', true);
  const SFX = {
    pop:  [520, 880, 0.08, 'sine', 0.18],
    grab: [880, 1320, 0.06, 'triangle', 0.12],
    done: [660, 1320, 0.22, 'square', 0.05],
    bad:  [220, 110, 0.2, 'sawtooth', 0.08],
    win:  [523, 1568, 0.6, 'triangle', 0.16],
  };
  function sfx(name) {
    if (!soundOn) return;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      const [f0, f1, dur, wave, vol] = SFX[name];
      const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
      o.type = wave;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + dur + 0.06);
    } catch (e) {}
  }

  // ---------- ステージ生成 ----------
  // 1回のタップでトレイの先頭から流れる数（1皿ずつ）
  function pushCount(col) {
    return col.length ? 1 : 0;
  }

  // 抽象化したシミュレーション（時間制限はないのでレーンの動きは無視できる）
  // pick(cols, need, free) が流す列を選ぶ。最後まで配膳できれば true
  function simulate(cols0, orders, cap, pick) {
    const cols = cols0.map(c => c.slice());
    const belt = {};
    let used = 0, q = 0;
    const seats = [];
    for (let i = 0; i < SEAT_COUNT; i++) seats.push(q < orders.length ? { ...orders[q++] } : null);
    for (let guard = 0; guard < 5000; guard++) {
      let changed = true;
      while (changed) {
        changed = false;
        for (let i = 0; i < seats.length; i++) {
          const s = seats[i];
          if (!s) continue;
          const take = Math.min(belt[s.t] || 0, s.n);
          if (take) { belt[s.t] -= take; used -= take; s.n -= take; changed = true; }
          if (s.n === 0) { seats[i] = q < orders.length ? { ...orders[q++] } : null; changed = true; }
        }
      }
      if (seats.every(s => !s)) return true;
      const need = new Set(seats.filter(Boolean).map(s => s.t));
      const best = pick(cols, need, cap - used);
      if (best < 0) return false;
      const c = cols[best], t = c[0], n = pushCount(c);
      c.splice(0, n);
      belt[t] = (belt[t] || 0) + n;
      used += n;
    }
    return false;
  }

  // 先読みして掘る賢い打ち方（jitter でゆらぎを入れて何通りか試す）
  const smartPick = jitter => (cols, need, free) => {
    let best = -1, bestScore = -Infinity;
    cols.forEach((c, i) => {
      if (!c.length) return;
      const n = pushCount(c);
      if (n > free) return;
      let score;
      if (need.has(c[0])) score = 1000 - n;
      else {
        const depth = c.findIndex(t => need.has(t));
        score = (depth < 0 ? -500 : -depth * 10) - n;
      }
      score += Math.random() * jitter;
      if (score > bestScore) { bestScore = score; best = i; }
    });
    return best;
  };
  // なにも考えずに、注文に合う列 → なければ適当な列を流す打ち方
  function naivePick(cols, need, free) {
    const fit = cols.map((c, i) => i).filter(i => cols[i].length && pushCount(cols[i]) <= free);
    if (!fit.length) return -1;
    const good = fit.filter(i => need.has(cols[i][0]));
    const pool = good.length ? good : fit;
    return pool[rand(pool.length)];
  }

  function solvable(cols, orders, cap) {
    if (simulate(cols, orders, cap, smartPick(0))) return true;
    for (let k = 0; k < 12; k++) if (simulate(cols, orders, cap, smartPick(40))) return true;
    return false;
  }

  // 何も考えない打ち方で何回失敗するか（難しさの目安）
  function naiveFails(cols, orders, cap, tries) {
    let f = 0;
    for (let k = 0; k < tries; k++) if (!simulate(cols, orders, cap, naivePick)) f++;
    return f;
  }

  function genLevel(lv) {
    const nTypes = Math.min(TYPES.length, 3 + lv);
    const nCust = Math.min(30, 6 + lv * 2);
    const nCols = lv < 3 ? 4 : 5;
    const cap = Math.max(12, Math.round(28 - lv));
    const maxCnt = lv < 3 ? 4 : lv < 6 ? 5 : 6;
    // 何も考えずに打つと 6 回中これだけ失敗する盤面を出す
    const wantFails = lv < 4 ? 0 : lv < 8 ? 1 : lv < 12 ? 3 : 4;
    let noise = Math.min(1, 0.2 + lv * 0.07);
    const types = TYPES.slice(0, nTypes);
    let fallback = null;
    for (let tries = 0; tries < 600; tries++) {
      if (tries && tries % 100 === 0) noise *= 0.8;
      const orders = [];
      for (let i = 0; i < nCust; i++) orders.push({ t: types[rand(nTypes)], n: 2 + rand(maxCnt - 1) });
      const pairs = [];
      for (const o of orders) {
        let n = o.n;
        while (n > 0) { const c = Math.min(n, 1 + rand(3)); pairs.push({ t: o.t, n: c }); n -= c; }
      }
      for (let i = 0; i < pairs.length; i++) {
        if (Math.random() < noise) {
          const j = Math.min(pairs.length - 1, i + 1 + rand(8 + lv));
          [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
        }
      }
      const cols = Array.from({ length: nCols }, () => []);
      for (const p of pairs) {
        const min = Math.min(...cols.map(c => c.length));
        const cand = cols.filter(c => c.length <= min + 2);
        const c = cand[rand(cand.length)];
        for (let k = 0; k < p.n; k++) c.push(p.t);
      }
      if (!solvable(cols, orders, cap)) continue;
      const fails = wantFails ? naiveFails(cols, orders, cap, 6) : 0;
      if (fails >= wantFails) return { cols, orders, cap };
      if (!fallback || fails > fallback.fails) fallback = { cols, orders, cap, fails };
    }
    if (fallback) return fallback;
    // 念のための保険：ノイズなしで並べる
    const orders = Array.from({ length: nCust }, () => ({ t: types[rand(nTypes)], n: 2 + rand(maxCnt - 1) }));
    const cols = Array.from({ length: nCols }, () => []);
    orders.forEach((o, i) => { for (let k = 0; k < o.n; k++) cols[i % nCols].push(o.t); });
    return { cols, orders, cap: Math.max(cap, 40) };
  }

  // ---------- 寿司の描画 ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function rice() {
    rr(-17, -3, 34, 17, 8);
    ctx.fillStyle = '#fffdf6'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#d8cdb8'; ctx.stroke();
  }
  function topping(fill, edge) {
    ctx.beginPath();
    ctx.ellipse(0, -5, 19.5, 9, -0.08, 0, Math.PI * 2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = edge; ctx.stroke();
  }
  function shine() {
    ctx.beginPath();
    ctx.ellipse(-7, -9, 6, 2, -0.2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff70'; ctx.fill();
  }
  function stripes(color, n, w) {
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, -5, 19.5, 9, -0.08, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = color; ctx.lineWidth = w;
    for (let i = 0; i < n; i++) {
      const x = -16 + i * (32 / (n - 1));
      ctx.beginPath(); ctx.moveTo(x - 4, 6); ctx.lineTo(x + 5, -16); ctx.stroke();
    }
    ctx.restore();
  }
  const DRAW = {
    maguro() { rice(); topping('#d8243a', '#9c1426'); shine(); },
    salmon() { rice(); topping('#ff8b4f', '#d55a25'); stripes('#ffe2cc', 4, 1.6); shine(); },
    ebi() {
      rice();
      ctx.beginPath(); ctx.moveTo(15, -6); ctx.lineTo(23, -13); ctx.lineTo(22, 0); ctx.closePath();
      ctx.fillStyle = '#e8402a'; ctx.fill();
      topping('#fff0e4', '#e08a6a'); stripes('#ff6a3d', 5, 3);
    },
    tamago() {
      rice();
      rr(-18, -15, 36, 15, 4); ctx.fillStyle = '#ffd93b'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#d9a514'; ctx.stroke();
      ctx.fillStyle = '#1e2a23'; ctx.fillRect(-4, -16, 8, 31);
    },
    tako() {
      rice(); topping('#c8507a', '#8e2e52');
      ctx.fillStyle = '#f7c9d8';
      for (const [x, y] of [[-10, -6], [-3, -3], [4, -7], [11, -4], [-6, -10], [7, -11]]) {
        ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
      }
    },
    ika() {
      rice(); topping('#f4f8fd', '#9db2c9');
      ctx.strokeStyle = '#c8d6e6'; ctx.lineWidth = 1.2;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 6 - 2, 2); ctx.lineTo(i * 6 + 2, -12); ctx.stroke(); }
      shine();
    },
    ikura() {
      rr(-15, -7, 30, 22, 6); ctx.fillStyle = '#1e2a23'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -7, 15, 5, 0, 0, Math.PI * 2); ctx.fillStyle = '#fffdf6'; ctx.fill();
      for (const [x, y] of [[-8, -9], [0, -11], [8, -9], [-4, -6], [4, -6], [-11, -5], [11, -5], [0, -4]]) {
        ctx.beginPath(); ctx.arc(x, y - 2, 3.6, 0, Math.PI * 2);
        ctx.fillStyle = '#ff4a1c'; ctx.fill();
        ctx.beginPath(); ctx.arc(x - 1, y - 3.2, 1.1, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd2c0'; ctx.fill();
      }
      ctx.fillStyle = '#ffffff22'; ctx.fillRect(-12, 0, 4, 12);
    },
    kappa() {
      ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fillStyle = '#1e2a23'; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 13.5, 0, Math.PI * 2); ctx.fillStyle = '#fffdf6'; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fillStyle = '#3f9a3a'; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#a7e07a'; ctx.fill();
    },
    onigiri() {
      ctx.beginPath();
      ctx.moveTo(0, -17);
      ctx.quadraticCurveTo(4, -17, 17, 9);
      ctx.quadraticCurveTo(19, 15, 12, 15);
      ctx.lineTo(-12, 15);
      ctx.quadraticCurveTo(-19, 15, -17, 9);
      ctx.quadraticCurveTo(-4, -17, 0, -17);
      ctx.fillStyle = '#fffdf6'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#d8cdb8'; ctx.stroke();
      rr(-8, 2, 16, 13, 2); ctx.fillStyle = '#1e2a23'; ctx.fill();
    },
  };
  function drawSushi(t, x, y, s, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.scale(s / 40, s / 40);
    DRAW[t]();
    ctx.restore();
  }

  // ---------- レイアウト ----------
  const Lo = {};
  function layout() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const rect = cv.getBoundingClientRect();
    const W = Lo.W = rect.width, H = Lo.H = rect.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    Lo.custTopY = 30;
    Lo.by0 = Lo.custTopY + 24 + TRACK_W / 2;
    const colTarget = Math.max(200, H * 0.4);
    Lo.by1 = Math.max(Lo.by0 + 170, Math.min(Lo.by0 + 340, H - 104 - colTarget));
    Lo.bx0 = 30; Lo.bx1 = W - 30;
    Lo.r = Math.min(60, (Lo.by1 - Lo.by0) / 3);
    Lo.cx = W / 2;
    Lo.custBotY = Lo.by1 + TRACK_W / 2 + 24;
    Lo.capY = Lo.custBotY + 34;
    Lo.colTop = Lo.capY + 22;
    Lo.colBot = H - 8;
    buildPath();

    const cxs = [0.27 * W, 0.73 * W];
    Lo.seats = [
      { x: cxs[0], y: Lo.custTopY },
      { x: cxs[1], y: Lo.custTopY },
      { x: cxs[1], y: Lo.custBotY },
      { x: cxs[0], y: Lo.custBotY },
    ];
    for (const s of Lo.seats) {
      const left = s.x < W / 2;
      s.bx = left ? Math.max(36, s.x - 56) : Math.min(W - 36, s.x + 56);
      s.by = s.y;
      // レーン上で一番近い位置（ここを通るネタを取る）
      let best = 0, bd = Infinity;
      for (let i = 0; i < 800; i++) {
        const p = pointAt(i / 800 * Lo.P);
        const d = (p[0] - s.x) ** 2 + (p[1] - s.y) ** 2;
        if (d < bd) { bd = d; best = i / 800 * Lo.P; }
      }
      s.ps = best;
    }
  }

  function buildPath() {
    const { bx0, by0, bx1, by1, r, cx } = Lo;
    const segs = [];
    const line = (x0, y0, x1, y1) => segs.push({ len: Math.hypot(x1 - x0, y1 - y0), f: t => [x0 + (x1 - x0) * t, y0 + (y1 - y0) * t] });
    const arc = (ax, ay, a0, a1) => segs.push({ len: Math.abs(a1 - a0) * r, f: t => { const a = a0 + (a1 - a0) * t; return [ax + Math.cos(a) * r, ay + Math.sin(a) * r]; } });
    line(cx, by1, bx1 - r, by1);
    arc(bx1 - r, by1 - r, Math.PI / 2, 0);
    line(bx1, by1 - r, bx1, by0 + r);
    arc(bx1 - r, by0 + r, 0, -Math.PI / 2);
    line(bx1 - r, by0, bx0 + r, by0);
    arc(bx0 + r, by0 + r, -Math.PI / 2, -Math.PI);
    line(bx0, by0 + r, bx0, by1 - r);
    arc(bx0 + r, by1 - r, Math.PI, Math.PI / 2);
    line(bx0 + r, by1, cx, by1);
    Lo.segs = segs;
    Lo.P = segs.reduce((a, s) => a + s.len, 0);
  }
  function pointAt(s) {
    const P = Lo.P;
    s = ((s % P) + P) % P;
    for (const g of Lo.segs) {
      if (s <= g.len) return g.f(g.len ? s / g.len : 0);
      s -= g.len;
    }
    return Lo.segs[0].f(0);
  }

  // 列ごとの描画寸法（レベル開始時とリサイズ時）
  function colGeom() {
    const n = G.cols.length, W = Lo.W;
    const gap = 8, pad = 12;
    const cw = (W - pad * 2 - gap * (n - 1)) / n;
    const colH = Lo.colBot - Lo.colTop;
    const step = Math.max(19, Math.min(cw * 0.62, 34, (colH - 18) / Math.max(8, G.maxLen)));
    Lo.col = { cw, gap, pad, step, size: Math.min(cw * 0.8, step * 1.45, 44), visible: Math.floor((colH - 18) / step) };
  }
  function colRect(i) {
    const c = Lo.col;
    return { x: c.pad + i * (c.cw + c.gap), y: Lo.colTop, w: c.cw, h: Lo.colBot - Lo.colTop };
  }

  // ---------- ゲーム状態 ----------
  let G = null;
  let level = store.get('sushi.level', 1);
  let fast = false;
  let toast = null;
  let running = false;

  function newState(lv) {
    const d = genLevel(lv);
    return {
      lv, cap: d.cap, L: Math.max(36, d.cap),
      cols: d.cols, maxLen: Math.max(...d.cols.map(c => c.length)),
      queue: d.orders, qi: 0, total: d.orders.length, served: 0,
      slots: new Array(Math.max(36, d.cap)).fill(null), off: 0,
      pending: [], flights: [],
      seats: Array.from({ length: SEAT_COUNT }, (_, i) => ({ state: 'empty', timer: 0.15 + i * 0.18, order: null, need: 0, shown: 0, animal: '', pop: 0 })),
      shake: new Array(d.cols.length).fill(0),
      dead: 0, ended: false, winTimer: -1,
    };
  }

  function startLevel(lv) {
    level = lv;
    store.set('sushi.level', lv);
    G = newState(lv);
    colGeom();
    updateHud();
    ['ovClear', 'ovOver', 'ovTitle'].forEach(id => $(id).classList.remove('show'));
    running = true;
  }

  function used() {
    let n = G.pending.length;
    for (const s of G.slots) if (s) n++;
    for (const f of G.flights) if (f.kind === 'toBelt') n++;
    return n;
  }

  function updateHud() {
    $('lv').textContent = 'Lv.' + G.lv;
    $('progText').textContent = `😋 ${G.served} / ${G.total}`;
    $('progBar').style.width = (G.served / G.total * 100) + '%';
  }

  function showToast(text) { toast = { text, t: 1.2 }; }

  function tapColumn(i) {
    const col = G.cols[i];
    if (!col || !col.length || G.ended) return;
    const n = pushCount(col);
    if (n > G.cap - used()) {
      G.shake[i] = 0.35;
      sfx('bad');
      showToast('レーンがいっぱい！');
      return;
    }
    const r = colRect(i), c = Lo.col;
    const items = col.splice(0, n);
    const now = performance.now() / 1000;
    items.forEach((t, k) => {
      G.flights.push({
        kind: 'toBelt', t,
        x0: r.x + r.w / 2, y0: r.y + 9 + c.step * k + c.step / 2,
        x1: Lo.cx, y1: Lo.by1 + TRACK_W / 2 + 14,
        start: now + k * 0.05, dur: 0.22, s0: c.size, s1: 24,
      });
    });
    sfx('pop');
  }

  // 前フレームの位置 pu から d 進む間に q を通過したか
  function crossed(pu, q, d, L) {
    return ((q - pu) % L + L) % L < d;
  }

  function update(dt) {
    const now = performance.now() / 1000;
    const L = G.L, spacing = Lo.P / L;
    const d = Math.min(0.9, (fast ? BASE_SPEED * 3 : BASE_SPEED) / spacing * dt);
    const offPrev = G.off;
    G.off = (G.off + d) % L;
    const entryU = 0;

    for (let i = 0; i < L; i++) {
      const pu = (i + offPrev) % L;
      if (!G.slots[i] && G.pending.length && crossed(pu, entryU, d, L)) {
        G.slots[i] = G.pending.shift();
        continue;
      }
      const item = G.slots[i];
      if (!item) continue;
      for (let si = 0; si < SEAT_COUNT; si++) {
        const seat = G.seats[si];
        if (seat.state !== 'order' || seat.need <= 0 || seat.order.t !== item.t) continue;
        if (!crossed(pu, Lo.seats[si].ps / Lo.P * L, d, L)) continue;
        seat.need--;
        G.slots[i] = null;
        const p = pointAt((pu + d) / L * Lo.P);
        G.flights.push({ kind: 'toSeat', t: item.t, seat: si, x0: p[0], y0: p[1], x1: Lo.seats[si].bx - 14, y1: Lo.seats[si].by, start: now, dur: 0.24, s0: beltItemSize(), s1: 24 });
        sfx('grab');
        break;
      }
    }

    // 飛んでいるネタ
    for (let k = G.flights.length - 1; k >= 0; k--) {
      const f = G.flights[k];
      if (now - f.start < f.dur) continue;
      G.flights.splice(k, 1);
      if (f.kind === 'toBelt') {
        G.pending.push({ t: f.t });
      } else {
        const seat = G.seats[f.seat];
        seat.shown--;
        seat.pop = 0.25;
        if (seat.shown <= 0) {
          seat.state = 'done'; seat.timer = 0.7;
          G.served++;
          updateHud();
          sfx('done');
        }
      }
    }

    // お客さん
    for (const seat of G.seats) {
      seat.pop = Math.max(0, seat.pop - dt);
      if (seat.state === 'order') continue;
      seat.timer -= dt;
      if (seat.timer > 0) continue;
      if (seat.state === 'done') { seat.state = 'empty'; seat.timer = 0.2; }
      else if (seat.state === 'arrive') seat.state = 'order';
      else if (seat.state === 'empty' && G.qi < G.queue.length) {
        const o = G.queue[G.qi++];
        Object.assign(seat, { state: 'arrive', timer: 0.25, order: o, need: o.n, shown: o.n, animal: ANIMALS[rand(ANIMALS.length)] });
      }
    }

    for (let i = 0; i < G.shake.length; i++) G.shake[i] = Math.max(0, G.shake[i] - dt);
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }

    if (G.ended) return;

    // クリア判定
    if (G.served >= G.total) {
      if (G.winTimer < 0) G.winTimer = 0.9;
      G.winTimer -= dt;
      if (G.winTimer <= 0) {
        G.ended = true;
        sfx('win');
        $('clearTitle').textContent = `Lv.${G.lv} クリア！`;
        $('ovClear').classList.add('show');
      }
      return;
    }

    // 詰み判定：待っても誰も取れず、どの列も流せない
    const settled = !G.flights.length && G.seats.every(s => s.state === 'order' || (s.state === 'empty' && G.qi >= G.queue.length));
    if (settled) {
      const need = new Set(G.seats.filter(s => s.state === 'order' && s.need > 0).map(s => s.order.t));
      const match = G.slots.some(s => s && need.has(s.t)) || G.pending.some(s => need.has(s.t));
      const free = G.cap - used();
      const canPush = G.cols.some(c => c.length && pushCount(c) <= free);
      G.dead = (!match && !canPush) ? G.dead + dt : 0;
    } else G.dead = 0;
    if (G.dead > 1.5) {
      G.ended = true;
      sfx('bad');
      $('ovOver').classList.add('show');
    }
  }

  function beltItemSize() { return Math.min(Lo.P / G.L * 0.95, 36); }

  // ---------- 描画 ----------
  function draw() {
    const { W, H, bx0, by0, bx1, by1, r } = Lo;
    ctx.clearRect(0, 0, W, H);

    // カウンター
    ctx.fillStyle = '#e9c48e';
    ctx.fillRect(0, 0, W, Lo.capY + 14);
    ctx.fillStyle = '#d7a96c';
    for (let y = 18; y < Lo.capY; y += 26) ctx.fillRect(0, y, W, 2);

    // 厨房
    const inset = TRACK_W / 2 + 4;
    rr(bx0 + inset, by0 + inset, bx1 - bx0 - inset * 2, by1 - by0 - inset * 2, Math.max(8, r - inset));
    const kg = ctx.createLinearGradient(0, by0, 0, by1);
    kg.addColorStop(0, '#4c5d86'); kg.addColorStop(1, '#2f3b5c');
    ctx.fillStyle = kg; ctx.fill();
    const kx = (bx0 + bx1) / 2, ky = (by0 + by1) / 2;
    const iw = bx1 - bx0 - inset * 2, ih = by1 - by0 - inset * 2;
    const cs = Math.min(iw * 0.4, ih * 0.5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${cs}px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    ctx.fillText('🐱', kx, ky - ih * 0.1);
    // ネタケース
    const caseW = Math.min(iw * 0.7, 220), caseH = Math.min(ih * 0.2, 40);
    rr(kx - caseW / 2, ky + ih * 0.2, caseW, caseH, 8);
    ctx.fillStyle = '#cfe8f3cc'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    const shown = TYPES.slice(0, Math.min(TYPES.length, 3 + G.lv));
    const cell = caseW / shown.length;
    shown.forEach((t, i) => drawSushi(t, kx - caseW / 2 + cell * (i + 0.5), ky + ih * 0.2 + caseH / 2, Math.min(cell * 0.9, caseH * 0.9)));

    // レーン
    rr(bx0, by0, bx1 - bx0, by1 - by0, r);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#7d8590'; ctx.lineWidth = TRACK_W + 10; ctx.stroke();
    ctx.strokeStyle = '#c9d0d8'; ctx.lineWidth = TRACK_W; ctx.stroke();
    ctx.strokeStyle = '#e3e8ee'; ctx.lineWidth = TRACK_W - 14; ctx.stroke();

    const L = G.L, spacing = Lo.P / L, is = beltItemSize();
    // 動きが分かるようにお皿の跡を描く
    for (let i = 0; i < L; i++) {
      const p = pointAt(((i + G.off) % L) * spacing);
      ctx.beginPath(); ctx.arc(p[0], p[1], 2, 0, Math.PI * 2);
      ctx.fillStyle = '#aab3bd'; ctx.fill();
    }
    // 投入口
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath(); ctx.moveTo(Lo.cx - 9, by1 + TRACK_W / 2 + 4); ctx.lineTo(Lo.cx + 9, by1 + TRACK_W / 2 + 4); ctx.lineTo(Lo.cx, by1 + TRACK_W / 2 - 4); ctx.fill();

    for (let i = 0; i < L; i++) {
      const it = G.slots[i];
      if (!it) continue;
      const p = pointAt(((i + G.off) % L) * spacing);
      ctx.beginPath(); ctx.ellipse(p[0], p[1] + is * 0.12, is * 0.56, is * 0.42, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#3a6fc2'; ctx.stroke();
      drawSushi(it.t, p[0], p[1], is);
    }

    // 投入待ち
    if (G.pending.length) {
      const y = by1 + TRACK_W / 2 + 18;
      const show = Math.min(3, G.pending.length);
      for (let k = show - 1; k >= 0; k--) drawSushi(G.pending[k].t, Lo.cx + k * 6, y + k * 4, 22, 1 - k * 0.2);
      if (G.pending.length > 3) {
        ctx.fillStyle = '#5a3519'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'left';
        ctx.fillText('+' + (G.pending.length - 3), Lo.cx + 26, y);
      }
    }

    // お客さん
    G.seats.forEach((seat, si) => drawSeat(seat, Lo.seats[si]));

    // 容量バー
    const u = used(), ratio = u / G.cap;
    const bw = W - 32, bh = 18, bxL = 16, byT = Lo.capY - bh / 2;
    rr(bxL, byT, bw, bh, 9); ctx.fillStyle = '#5a3519'; ctx.fill();
    if (u > 0) {
      rr(bxL + 2, byT + 2, Math.max(14, (bw - 4) * ratio), bh - 4, 7);
      ctx.fillStyle = ratio < 0.6 ? '#8fcf55' : ratio < 0.85 ? '#f5b73b' : '#ef5b3b';
      ctx.fill();
    }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`レーン ${u} / ${G.cap}`, W / 2, Lo.capY + 1);

    // トレイ
    const c = Lo.col;
    G.cols.forEach((col, i) => {
      const rc = colRect(i);
      const sx = G.shake[i] ? Math.sin(G.shake[i] * 60) * 5 : 0;
      ctx.save(); ctx.translate(sx, 0);
      rr(rc.x, rc.y, rc.w, rc.h, 10);
      ctx.fillStyle = '#9a6234'; ctx.fill();
      rr(rc.x + 4, rc.y + 4, rc.w - 8, rc.h - 8, 7);
      ctx.fillStyle = '#b8783f'; ctx.fill();
      if (col.length) {
        const n = pushCount(col);
        const vis = Math.min(col.length, c.visible);
        const t = performance.now() / 1000;
        rr(rc.x + 6, rc.y + 7, rc.w - 12, c.step * Math.min(n, vis) + 4, 8);
        ctx.fillStyle = `rgba(255,240,180,${0.35 + Math.sin(t * 5) * 0.12})`; ctx.fill();
        for (let k = vis - 1; k >= 0; k--) {
          drawSushi(col[k], rc.x + rc.w / 2, rc.y + 9 + c.step * k + c.step / 2, c.size);
        }
        if (col.length > vis) {
          ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
          ctx.fillText('+' + (col.length - vis), rc.x + rc.w / 2, rc.y + rc.h - 10);
        }
      }
      ctx.restore();
    });

    // 飛行中
    const now = performance.now() / 1000;
    for (const f of G.flights) {
      const k = Math.max(0, Math.min(1, (now - f.start) / f.dur));
      if (now < f.start) { if (f.kind === 'toBelt') drawSushi(f.t, f.x0, f.y0, f.s0); continue; }
      const e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      const x = f.x0 + (f.x1 - f.x0) * e;
      const y = f.y0 + (f.y1 - f.y0) * e - Math.sin(Math.PI * k) * 40;
      drawSushi(f.t, x, y, f.s0 + (f.s1 - f.s0) * e);
    }

    if (fast) {
      ctx.fillStyle = '#ffffffcc'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('▶▶ 早送り', kx, by0 + inset + 14);
    }

    if (toast) {
      ctx.globalAlpha = Math.min(1, toast.t * 3);
      ctx.font = 'bold 16px system-ui';
      const tw = ctx.measureText(toast.text).width + 28;
      rr(W / 2 - tw / 2, ky - 20, tw, 40, 20);
      ctx.fillStyle = '#e3452aee'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText(toast.text, W / 2, ky + 1);
      ctx.globalAlpha = 1;
    }
  }

  function drawSeat(seat, pos) {
    if (seat.state === 'empty') {
      ctx.beginPath(); ctx.ellipse(pos.x, pos.y + 14, 18, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#0000001a'; ctx.fill();
      return;
    }
    let scale = 1;
    if (seat.state === 'arrive') scale = 1 - seat.timer / 0.25;
    if (seat.state === 'done') scale = 1 + Math.sin((1 - seat.timer / 0.7) * Math.PI * 4) * 0.06;
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(scale, scale);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '40px system-ui, "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
    ctx.fillText(seat.animal, 0, 0);
    ctx.restore();

    if (seat.state === 'done') {
      const k = 1 - seat.timer / 0.7;
      ctx.globalAlpha = Math.max(0, 1 - k);
      ctx.font = '22px system-ui, "Apple Color Emoji", sans-serif';
      ctx.fillText('💕', pos.x + 16, pos.y - 18 - k * 20);
      ctx.font = 'bold 12px system-ui'; ctx.fillStyle = '#d9452b';
      ctx.fillText('ごちそうさま！', pos.bx, pos.by);
      ctx.globalAlpha = 1;
      return;
    }
    if (seat.state !== 'order') return;
    const ps = 1 + seat.pop * 0.6;
    ctx.save();
    ctx.translate(pos.bx, pos.by);
    ctx.scale(ps, ps);
    const w = 62, h = 34;
    const toRight = pos.bx > pos.x;
    ctx.beginPath();
    ctx.moveTo(toRight ? -w / 2 + 2 : w / 2 - 2, -5);
    ctx.lineTo(toRight ? -w / 2 - 8 : w / 2 + 8, 0);
    ctx.lineTo(toRight ? -w / 2 + 2 : w / 2 - 2, 5);
    ctx.fillStyle = '#fff'; ctx.fill();
    rr(-w / 2, -h / 2, w, h, 14);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#e2c79f'; ctx.stroke();
    drawSushi(seat.order.t, -14, 1, 26);
    ctx.fillStyle = '#3a2414'; ctx.font = 'bold 17px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('×' + seat.shown, 14, 1);
    ctx.restore();
  }

  // ---------- 入力 ----------
  cv.addEventListener('pointerdown', e => {
    if (!running || !G) return;
    if (AC && AC.state === 'suspended') AC.resume();
    const rect = cv.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (y >= Lo.colTop - 8) {
      for (let i = 0; i < G.cols.length; i++) {
        const rc = colRect(i);
        if (x >= rc.x - Lo.col.gap / 2 && x <= rc.x + rc.w + Lo.col.gap / 2) { tapColumn(i); break; }
      }
    } else if (y < Lo.capY - 12) {
      fast = true;
    }
  });
  const stopFast = () => { fast = false; };
  window.addEventListener('pointerup', stopFast);
  window.addEventListener('pointercancel', stopFast);

  $('btnStart').onclick = () => { sfx('pop'); startLevel(level); };
  document.querySelectorAll('.modes button').forEach(b => {
    b.onclick = () => { sfx('pop'); startLevel(+b.dataset.lv); };
  });
  $('btnNext').onclick = () => { sfx('pop'); startLevel(G.lv + 1); };
  $('btnAgain').onclick = () => { sfx('pop'); startLevel(G.lv); };
  $('btnRetry').onclick = () => { if (G) startLevel(G.lv); };
  const syncSound = () => { $('btnSound').textContent = soundOn ? '🔊' : '🔇'; };
  $('btnSound').onclick = () => { soundOn = !soundOn; store.set('sushi.sound', soundOn); syncSound(); sfx('pop'); };
  syncSound();
  $('btnStart').textContent = level > 1 ? `Lv.${level} からあそぶ` : 'あそぶ';

  window.addEventListener('resize', () => { layout(); if (G) colGeom(); });

  // ---------- ループ ----------
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (G) {
      if (running) update(dt);
      draw();
    }
    requestAnimationFrame(frame);
  }

  layout();
  // タイトルの裏に盤面を見せておく
  G = newState(level);
  colGeom();
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
